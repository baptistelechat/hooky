name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Hooky ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          # Changelog auto-généré par GitHub (commits depuis le tag précédent) -- pas de
          # process de changelog manuel dans ce repo, pas de raison de laisser le draft
          # vide.
          generateReleaseNotes: true
          # Pas de plugin tauri-plugin-updater (BDR-064, décision volontaire) : ce
          # manifest de signature ne sert jamais, seulement à générer un avertissement
          # "Signature not found" dans les logs à chaque run.
          includeUpdaterJson: false
